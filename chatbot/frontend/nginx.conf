server {
    listen 80;
    server_name _;

    # Serve the React static build
    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router — send all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* ? FastAPI gateway container
    # In Docker Compose the gateway service is reachable at http://gateway:8000
    location /api/ {
        proxy_pass http://gateway:8000/api/;
        proxy_http_version 1.1;

        # Required for SSE (streaming chat responses)
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Generous timeout for LLM streaming responses
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Proxy /health ? gateway for health checks
    location /health {
        proxy_pass http://gateway:8000/health;
        proxy_set_header Host $host;
    }

    # Gzip compression for faster loads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
