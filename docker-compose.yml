# ============================================================
# EduGuardian AI - Full Stack Docker Compose
# ============================================================
# ONE COMMAND to run everything:
#   docker compose up --build
#
# Services:
#   db              - PostgreSQL 15 database          :5432
#   edu-backend     - Main REST API (FastAPI)         :5000
#   gateway         - AI Chatbot Gateway              :8000
#   agent-insight   - Student Insight A2A agent       :8001
#   agent-planner   - Study Planner A2A agent         :8002
#   agent-coach     - Recovery Coach A2A agent        :8003
#   chatbot-ui      - AI Chat Frontend (React)        :3000
#   student-ui      - Student Dashboard (React)       :3001
#   admin-ui        - Teacher/Admin Portal (React)    :3002
#
# Access URLs:
#   Student Portal   -> http://localhost:3001
#   Admin Portal     -> http://localhost:3002
#   AI Chatbot UI    -> http://localhost:3000
#   Main Backend API -> http://localhost:5000
#   Chatbot Gateway  -> http://localhost:8000
# ============================================================

services:

  # -- Shared PostgreSQL Database ------------------------------
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./seed_students.sql:/docker-entrypoint-initdb.d/02-seed_students.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Main REST API: edu-backend (:5000) ----------------------
  edu-backend:
    build:
      context: ./edu-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      database_url: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/eduguardian
      secret_key: ${SECRET_KEY:-eduguardian-dev-secret-key-2026}
    depends_on:
      db:
        condition: service_healthy

  # -- Student Insight A2A Microservice (:8001) -----------------
  agent-insight:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/eduguardian_chatbot
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      A2A_AGENT_URL: http://agent-insight:8001
      STUDENT_INSIGHT_AGENT_URL: http://agent-insight:8001
      OMNIROUTE_BASE_URL: http://host.docker.internal:20128/v1
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-openai/gpt-oss-120b}
      STUDENT_CONTEXT_CACHE_TTL_SECONDS: ${STUDENT_CONTEXT_CACHE_TTL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn chatbot.backend.services.insight_service:app
      --host 0.0.0.0
      --port 8001

  # -- Study Planner A2A Microservice (:8002) -------------------
  agent-planner:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/eduguardian_chatbot
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      A2A_AGENT_URL: http://agent-planner:8002
      STUDY_PLANNER_AGENT_URL: http://agent-planner:8002
      OMNIROUTE_BASE_URL: http://host.docker.internal:20128/v1
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-openai/gpt-oss-120b}
      STUDENT_CONTEXT_CACHE_TTL_SECONDS: ${STUDENT_CONTEXT_CACHE_TTL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn chatbot.backend.services.planner_service:app
      --host 0.0.0.0
      --port 8002

  # -- Recovery Coach A2A Microservice (:8003) ------------------
  agent-coach:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/eduguardian_chatbot
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      A2A_AGENT_URL: http://agent-coach:8003
      RECOVERY_COACH_AGENT_URL: http://agent-coach:8003
      OMNIROUTE_BASE_URL: http://host.docker.internal:20128/v1
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-openai/gpt-oss-120b}
      STUDENT_CONTEXT_CACHE_TTL_SECONDS: ${STUDENT_CONTEXT_CACHE_TTL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn chatbot.backend.services.coach_service:app
      --host 0.0.0.0
      --port 8003

  # -- FastAPI Gateway + LangGraph Orchestrator (:8000) --------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/eduguardian_chatbot
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      STUDENT_INSIGHT_AGENT_URL: http://agent-insight:8001
      STUDY_PLANNER_AGENT_URL: http://agent-planner:8002
      RECOVERY_COACH_AGENT_URL: http://agent-coach:8003
      OMNIROUTE_BASE_URL: http://host.docker.internal:20128/v1
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-openai/gpt-oss-120b}
      STUDENT_CONTEXT_CACHE_TTL_SECONDS: ${STUDENT_CONTEXT_CACHE_TTL_SECONDS:-3600}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-eduguardian-super-secret-key-2024}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost,http://localhost:80,http://chatbot-ui:80"
    depends_on:
      db:
        condition: service_healthy
      agent-insight:
        condition: service_started
      agent-planner:
        condition: service_started
      agent-coach:
        condition: service_started
    command: >
      uvicorn chatbot.backend.api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2

  # -- AI Chatbot Frontend (Port 3000) -------------------------
  chatbot-ui:
    build:
      context: ./chatbot/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - gateway

  # -- Student Dashboard Portal (Port 3001) --------------------
  student-ui:
    build:
      context: ./prat-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - edu-backend

  # -- Teacher & Admin Portal (Port 3002) -----------------------
  admin-ui:
    build:
      context: ./ash-frontend/admin-portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - edu-backend

volumes:
  postgres_data:
